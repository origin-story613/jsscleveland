<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting&hellip;</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  {%- comment -%} JS runs first so a #section anchor on the old link is kept; the meta refresh is the fallback. {%- endcomment %}
  <script>location.replace("{{ page.redirect_to | relative_url }}" + location.hash);</script>
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
</head>
<body>
  <p>This page has moved to <a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_to | absolute_url }}</a>.</p>
</body>
</html>
